server:
  port: 8761

eureka:
  instance:
    hostname: eureka-server
  client:
    # This IS the registry -- it doesn't need to register with itself or
    # fetch a registry from anywhere else.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Single standalone instance in dev; a fresh registry with nothing
    # registered yet looks identical to a broken one, so skip the
    # self-preservation heuristic that's meant for real multi-node quorums.
    enable-self-preservation: false
