server:
  port: 8000

spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:parking}
    password: ${SPRING_DATASOURCE_PASSWORD:parking}
  jpa:
    hibernate:
      # Bare-minimum table creation for now, same as every other service.
      # Replace with Flyway/Liquibase migrations once the schema needs to
      # evolve.
      ddl-auto: update
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.smartparking.notificationservice.messaging

jwt:
  # Must be identical to auth-service's JWT_SECRET -- this service only
  # verifies tokens auth-service issues, it never issues its own.
  secret: ${JWT_SECRET:dev-secret-please-use-a-longer-random-value-in-real-deployments}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
