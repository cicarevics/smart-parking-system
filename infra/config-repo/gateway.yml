spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          # lb:// resolves AUTH-SERVICE against Eureka instead of a static
          # host:port -- this replaces Traefik's Docker-label discovery.
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
          filters:
            - StripPrefix=1
        - id: parking-service
          uri: lb://PARKING-SERVICE
          predicates:
            - Path=/parking/**
          filters:
            - StripPrefix=1
        - id: reservation-service
          uri: lb://RESERVATION-SERVICE
          predicates:
            - Path=/reservations/**
          filters:
            - StripPrefix=1
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payments/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**
          filters:
            - StripPrefix=1
