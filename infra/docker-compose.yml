services:
  eureka-server:
    build:
      context: ..
      dockerfile: services/eureka-server/Dockerfile
    ports:
      - "8761:8761" # dashboard: http://localhost:8761

  config-server:
    build:
      context: ..
      dockerfile: services/config-server/Dockerfile
    ports:
      - "8888:8888" # e.g. http://localhost:8888/auth-service/default
    depends_on:
      - eureka-server

  kafka:
    # Single-node KRaft mode (broker+controller combined) -- no Zookeeper
    # needed. Backs the async path: reservation-service and
    # payment-service publish events here, notification-service consumes
    # them (see infra/config-repo/application.yml's shared
    # spring.kafka.bootstrap-servers).
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    # Datasource and JWT settings now come from config-server
    # (infra/config-repo/{application,auth-service}.yml), not from env
    # vars here -- that's the point of centralizing them. application.yml
    # still has local defaults as a fallback for running this outside
    # Docker without the full stack up.
    depends_on:
      postgres-auth:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    expose:
      - "8000"

  postgres-user:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    # See auth-service's comment -- same config-server-driven setup.
    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    expose:
      - "8000"

  postgres-parking:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: parking_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_parking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  parking-service:
    # Spring Boot from the start -- no legacy Python version.
    build:
      context: ..
      dockerfile: services/parking-service/Dockerfile
    # See auth-service's comment -- same config-server-driven setup.
    depends_on:
      postgres-parking:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    expose:
      - "8000"

  postgres-reservation:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: reservation_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_reservation_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d reservation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  reservation-service:
    # First service that calls another service directly (parking-service's
    # claim/release), using a self-minted internal token rather than the
    # driver's own -- see infra/config-repo/reservation-service.yml and the
    # reservation-flow design notes for why.
    build:
      context: ..
      dockerfile: services/reservation-service/Dockerfile
    # See auth-service's comment -- same config-server-driven setup.
    depends_on:
      postgres-reservation:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      kafka:
        condition: service_started
    expose:
      - "8000"

  postgres-payment:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: payment_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    # Calls reservation-service directly (ownership-check GET, confirm,
    # failure-path cancel) -- see infra/config-repo and the Charge and
    # Confirm design notes for which calls forward the driver's own token
    # vs mint an internal one.
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    # See auth-service's comment -- same config-server-driven setup.
    depends_on:
      postgres-payment:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      kafka:
        condition: service_started
    expose:
      - "8000"

  postgres-notification:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: notification_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-service:
    # Consumes reservation-events/payment-events from Kafka and records a
    # Notification row for each -- the system's asynchronous counterpart
    # to every other service's synchronous REST calls.
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    # See auth-service's comment -- same config-server-driven setup.
    depends_on:
      postgres-notification:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      kafka:
        condition: service_started
    expose:
      - "8000"

  gateway:
    # Replaces Traefik. Routes come from config-server
    # (infra/config-repo/gateway.yml) and resolve against Eureka
    # (lb://AUTH-SERVICE, lb://USER-SERVICE, lb://PARKING-SERVICE) instead
    # of Docker labels -- this also means, unlike Traefik, it needs no
    # Docker socket access.
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    ports:
      - "80:8080" # gateway entrypoint -> e.g. http://localhost/auth/login
    depends_on:
      - eureka-server
      - config-server
      - auth-service
      - user-service
      - parking-service
      - reservation-service
      - payment-service
      - notification-service

volumes:
  postgres_auth_data:
  postgres_user_data:
  postgres_parking_data:
  postgres_reservation_data:
  postgres_payment_data:
  postgres_notification_data:
