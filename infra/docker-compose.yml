services:
  eureka-server:
    build:
      context: ..
      dockerfile: services/eureka-server/Dockerfile
    ports:
      - "8761:8761" # dashboard: http://localhost:8761

  config-server:
    build:
      context: ..
      dockerfile: services/config-server/Dockerfile
    ports:
      - "8888:8888" # e.g. http://localhost:8888/auth-service/default
    depends_on:
      - eureka-server

  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    # Datasource and JWT settings now come from config-server
    # (infra/config-repo/{application,auth-service}.yml), not from env
    # vars here -- that's the point of centralizing them. application.yml
    # still has local defaults as a fallback for running this outside
    # Docker without the full stack up.
    depends_on:
      postgres-auth:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    expose:
      - "8000"

  postgres-user:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    # See auth-service's comment -- same config-server-driven setup.
    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    expose:
      - "8000"

  postgres-parking:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: parking_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_parking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking"]
      interval: 5s
      timeout: 5s
      retries: 5

  parking-service:
    # Spring Boot from the start -- no legacy Python version.
    build:
      context: ..
      dockerfile: services/parking-service/Dockerfile
    # See auth-service's comment -- same config-server-driven setup.
    depends_on:
      postgres-parking:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    expose:
      - "8000"

  postgres-reservation:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: reservation_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_reservation_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking"]
      interval: 5s
      timeout: 5s
      retries: 5

  reservation-service:
    # First service that calls another service directly (parking-service's
    # claim/release), using a self-minted internal token rather than the
    # driver's own -- see infra/config-repo/reservation-service.yml and the
    # reservation-flow design notes for why.
    build:
      context: ..
      dockerfile: services/reservation-service/Dockerfile
    # See auth-service's comment -- same config-server-driven setup.
    depends_on:
      postgres-reservation:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    expose:
      - "8000"

  postgres-payment:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: payment_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    # Calls reservation-service directly (ownership-check GET, confirm,
    # failure-path cancel) -- see infra/config-repo and the Charge and
    # Confirm design notes for which calls forward the driver's own token
    # vs mint an internal one.
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    # See auth-service's comment -- same config-server-driven setup.
    depends_on:
      postgres-payment:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    expose:
      - "8000"

  gateway:
    # Replaces Traefik. Routes come from config-server
    # (infra/config-repo/gateway.yml) and resolve against Eureka
    # (lb://AUTH-SERVICE, lb://USER-SERVICE, lb://PARKING-SERVICE) instead
    # of Docker labels -- this also means, unlike Traefik, it needs no
    # Docker socket access.
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    ports:
      - "80:8080" # gateway entrypoint -> e.g. http://localhost/auth/login
    depends_on:
      - eureka-server
      - config-server
      - auth-service
      - user-service
      - parking-service
      - reservation-service
      - payment-service

volumes:
  postgres_auth_data:
  postgres_user_data:
  postgres_parking_data:
  postgres_reservation_data:
  postgres_payment_data:

# NOTE: Kafka is intentionally not included yet. reservation-service's
# claim-and-expire logic and payment-service's confirm/cancel calls all
# work via synchronous service-to-service calls for now (no
# ReservationCreated/ReservationExpired events published). Kafka gets
# added once notification-service exists and actually needs to consume
# something.
